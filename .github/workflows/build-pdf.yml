name: Compilar PDF

on:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Compilar main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode -jobname=EspacioUNAMCodigos"

      - name: Subir PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EspacioUNAMCodigos
          path: EspacioUNAMCodigos.pdf
          if-no-files-found: error